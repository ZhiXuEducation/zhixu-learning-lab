<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知序｜普华考前48分复习</title><link rel="stylesheet" href="psle-review.css"><script src="psle-review-data.js" defer></script><script src="psle-review.js" defer></script></head><body><header><div><a href="primary.html">知序 · ZHIXU</a><p>PSLE 普华 · 考前复习</p><h1>练稳这48分</h1><p>语文应用30分 · 短文填空10分 · 完成对话8分</p></div></header><main>
<section id="home"><div class="card"><span class="tag">5套原创模拟 · 120题</span><h2>选择今天的训练</h2><p>综合模拟每套24题，完成后统一批改。专项训练可按七类语文应用考点练习，也可练整篇短文或完整对话。</p><p class="muted">这是试卷二中48分部分的模拟训练。阅读理解（一）、（二）留在课堂学习。</p><p id="storage-note" role="status"></p></div><h2>综合模拟</h2><div id="sets" class="grid"></div><h2>专项冲刺</h2><div class="card"><label for="specialty">训练项目</label><select id="specialty"><option value="language">语文应用 · 全部75题</option><option>汉语拼音</option><option>汉字辨析</option><option>词语选择</option><option>词语解释</option><option>关联词语</option><option>句子衔接</option><option>词语运用</option><option value="cloze">短文填空 · 5篇</option><option value="dialogue">完成对话 · 5篇</option></select><button id="start-specialty">开始专项训练</button><p class="muted">专项与综合模拟使用同一题库，按考点重新组合；短文和对话保留完整语境。</p></div><div class="card"><h2>我的错题</h2><p id="wrong-count"></p><button id="start-wrong">重练错题</button><p class="muted">错题、进度与成绩只存于当前浏览器；换设备不会同步。</p></div></section>
<section id="quiz" hidden><div class="card"><div class="row"><span id="quiz-name" class="tag"></span><button id="exit" class="secondary">保存并返回</button></div><progress id="progress" max="1" value="0"></progress><p id="position"></p><h2 id="group-name" tabindex="-1"></h2><p id="instructions" class="notice"></p><div id="passage" class="passage"></div><form id="quiz-form"><div id="questions"></div><p id="error" role="alert"></p><div class="row"><button type="button" id="previous" class="secondary">上一组</button><button id="next">下一组</button></div></form></div></section>
<section id="results" hidden><div class="card"><span class="tag">本次训练完成</span><h2 id="result-name" tabindex="-1"></h2><p class="score" id="score"></p><p id="breakdown"></p><div class="row"><button id="retry">重练本次错题</button><button id="return-home" class="secondary">返回训练首页</button></div></div><div id="review"></div></section>
<noscript>请启用JavaScript后使用自动批改与选择题训练。</noscript></main><footer>© ZHIXU Education · 原创考前训练</footer></body></html>
