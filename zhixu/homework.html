<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知序｜功课</title><link rel="stylesheet" href="portal.css"><style>main{max-width:1100px;margin:auto;padding:20px}fieldset{margin:16px 0;border:1px solid #ccd8d1;border-radius:8px}fieldset label{display:inline-flex;gap:8px;align-items:center;padding:8px}input[type=checkbox]{width:auto}#exercise-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));max-height:340px;overflow:auto}#summary{padding:16px;background:#edf4ef;border-radius:8px}.filters{display:flex;gap:12px;flex-wrap:wrap}.table-wrap{overflow:auto}td,th{padding:10px;text-align:left}button,a{min-height:40px}#publish-form{margin-bottom:24px}#status{white-space:pre-wrap}</style><script defer src="homework.js?v=1"></script></head><body><header><h1>知序 · 功课</h1></header><main><a href="portal.html">← 返回我的课程／管理后台</a><h2 id="heading">我的功课</h2><p id="status" role="status" aria-live="polite">正在读取…</p>
<form id="publish-form" hidden><h3>布置功课</h3><label>功课名称<input id="title" required maxlength="100" placeholder="例如：星期二班 · 单元一 A、B套"></label><div class="filters"><label>课程<select id="course"></select></label><label>截止日期<input id="due" type="date" required></label></div><p>截止至所选日期晚上 11:59（新加坡时间）。每套独立计算完成情况，逾期仍可补交。</p><fieldset><legend>选择学生</legend><button type="button" id="select-all">全选当前课程学生</button><div id="student-options"></div></fieldset><fieldset><legend>选择练习套数（可多选）</legend><div id="exercise-options"></div></fieldset><button id="publish">发布功课</button></form>
<div class="filters"><label>学生<select id="filter-student"><option value="">全部学生</option></select></label><label>状态<select id="filter-status"><option value="">全部状态</option><option value="incomplete">未完成（含逾期）</option><option value="overdue">已逾期</option><option value="completed">已完成（含迟交）</option></select></label><button id="reload" type="button">刷新完成情况</button></div><p id="summary"></p><div class="table-wrap"><table><thead><tr><th id="student-th">学生</th><th>功课／练习</th><th>截止日期</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p>发布前的答题不计入新功课。发布后完成同一套练习（包括自由练习）即可交功课；重复练习只计算一次，按首次提交判断是否迟交。</p></main></body></html>
