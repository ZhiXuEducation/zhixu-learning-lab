<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知序｜学生与课程管理</title><link rel="stylesheet" href="portal.css"><script defer src="portal.js"></script></head><body>
<header><div><h1>知序 · ZHIXU</h1><p>学习有方法，进步有脉络。</p></div></header><main>
<p id="message" role="status" aria-live="polite"></p>
<section id="login"><h2>欢迎回到知序</h2><div class="grid">
<form id="student-login" class="card"><h3>学生登录</h3><label>学生编号<input name="code" required maxlength="14" autocomplete="username" placeholder="ZX…"></label><label>4位 PIN<input name="pin" type="password" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password"></label><button>进入我的课程</button><p class="muted">请向老师领取学生编号和 PIN。尝试过多时请稍后重试，或联系老师重设 PIN。</p></form>
<form id="admin-login" class="card"><h3>管理员登录</h3><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录管理后台</button></form></div></section>
<section id="workspace" hidden><div class="row"><h2 id="greeting">我的课程</h2><button id="logout" class="secondary">退出登录</button></div>
<section id="admin" hidden><h2>学生管理</h2><p class="muted">新增学生后，编号和 PIN 只在本次创建结果中显示。修改资料会让该学生重新登录。</p>
<form id="student-editor" class="card"><h3 id="editor-title">新增学生</h3><input type="hidden" name="id"><div class="grid"><label>姓名<input name="name" required maxlength="80"></label><label>年级<select name="grade"><option>P6</option><option>S1</option><option>S2</option><option>S3</option><option>S4</option></select></label></div><fieldset><legend>授权课程</legend><div id="course-options"></div></fieldset><label id="active-label" hidden><input type="checkbox" name="active" checked>启用学生账号</label><div class="row"><button>保存学生</button><button type="button" id="cancel-edit" class="secondary">取消编辑</button></div></form>
<aside id="credentials" class="card" hidden aria-live="polite"><h3>学生登录资料</h3><p id="new-code"></p><p id="new-pin"></p><p>请现在记录并交给学生，关闭后无法查看原 PIN。</p><button id="hide-credentials" class="secondary">我已记录，隐藏 PIN</button></aside>
<div class="table-wrap"><table><thead><tr><th>编号</th><th>姓名</th><th>年级</th><th>课程</th><th>状态</th><th>操作</th></tr></thead><tbody id="students"></tbody></table></div></section><div id="courses" class="grid"></div></section>
<section id="lesson" hidden><button id="close-lesson" class="secondary">← 返回课程列表</button><iframe id="lesson-frame" title="课程练习" referrerpolicy="no-referrer"></iframe></section>
</main><footer>© ZHIXU Education</footer></body></html>
