const $=id=>document.getElementById(id);let bank=[],active=null,pool=[],pos=0,submitted=false,responses=[],reviewIds=null,storageOK=true;const KEY='zhixu_s4_unit_v1';
function read(){try{const r=JSON.parse(localStorage.getItem(KEY)||'{}');return r&&typeof r==='object'&&!Array.isArray(r)?r:{}}catch{storageOK=false;return {}}}function save(x){try{localStorage.setItem(KEY,JSON.stringify(x))}catch{storageOK=false}}
function show(id){for(const n of ['home','quiz','results'])$(n).hidden=n!==id;window.scrollTo(0,0)}

tent=pos===pool.length-1?'查看成绩 →':'下一篇 →';$('formError').textContent=''}
