<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知序｜P6 普华字词训练</title><style>:root{--green:#425d52;--cream:#f7f3ea;--gold:#b39a68;--ink:#303a35}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:system-ui,-apple-system,'Noto Sans SC',sans-serif;color:var(--ink)}header{background:var(--green);color:white;padding:28px 20px}header div,main{max-width:760px;margin:auto}header h1{margin:0;font-size:28px;letter-spacing:2px}header p{margin:8px 0 0;color:#e6e6dc}main{padding:24px 16px 70px}.card{background:white;border:1px solid #e8e4d9;border-radius:16px;padding:24px;box-shadow:0 8px 24px #273a2d0b;margin-bottom:18px}.tag{color:#7b715c;font-size:13px}.btn{background:var(--green);border:0;border-radius:9px;color:white;padding:12px 18px;font-size:16px;cursor:pointer}.btn.secondary{background:#e9e9e0;color:var(--ink)}.btn:disabled{opacity:.5;cursor:default}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.option{display:block;width:100%;text-align:left;padding:14px;margin:10px 0;border:1px solid #d6ded6;border-radius:10px;background:#fff;font-size:16px;cursor:pointer;color:var(--ink)}.option.selected{border:2px solid var(--green);background:#eff5f0}.option.correct{background:#e1f2e4;border-color:#4a9063}.option.wrong{background:#fae5e1;border-color:#c76c64}.muted{color:#777}.bar{height:8px;background:#e8ebe5;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:var(--gold);transition:width .2s}.hidden{display:none}.answer{border-left:4px solid var(--gold);padding:12px;background:#faf8f1;margin-top:16px;line-height:1.7}.big{font-size:40px;font-weight:700;color:var(--green)}select{padding:10px;border-radius:8px;border:1px solid #ccd5cd;font-size:15px}footer{text-align:center;color:#888;font-size:12px;padding:20px}</style></head><body><header><div><h1>知序 · ZHIXU</h1><p>学习有方法，进步有脉络。｜Learning Lab</p></div></header><main><section id="home" class="card"><div class="tag">P6 普华 · 试用版 v0.1</div><h2>字词专项训练</h2><p>20个词语 · 20道原创练习题 · 自动批改与错题复习</p><p class="muted">词语参考现有教研资料的部分历年考点，并补充测试词语；本练习不是官方真题。</p><label for="mode">训练模式：</label> <select id="mode"><option value="all">综合训练（20题）</option><option value="拼音辨析">拼音辨析</option><option value="词语理解">词语理解</option><option value="词语应用">词语应用</option><option value="wrong">上次错题复习</option></select><p id="saved" class="muted"></p><button class="btn" id="start">开始训练 →</button></section><section id="quiz" class="card hidden"><div class="row" style="justify-content:space-between"><span id="progress"></span><span id="category" class="tag"></span></div><div class="bar" style="margin:14px 0 24px"><div id="fill"></div></div><h2 id="question" style="line-height:1.6"></h2><div id="options"></div><div id="feedback" class="answer hidden"></div><div class="row" style="margin-top:20px"><button class="btn" id="check" disabled>提交答案</button><button class="btn hidden" id="next">下一题 →</button></div></section><section id="results" class="card hidden"><div class="tag">训练完成</div><h2>本次成绩</h2><div class="big" id="score"></div><p id="summary"></p><div id="review"></div><div class="row" style="margin-top:20px"><button class="btn" id="again">重新练习</button><button class="btn secondary" id="retry">练习本次错题</button></div></section></main><footer>© ZHIXU Education · 教学试用版｜记录仅储存在当前浏览器</footer><script>
const questions=[
['诚实','拼音辨析','“诚实”的正确拼音是？',['chéng shí','chén shí','chéng sí','chěng shí'],0,'“诚”是后鼻音 chéng；“实”是翘舌音 shí。'],
['灵巧','拼音辨析','“灵巧”的正确拼音是？',['lín qiǎo','líng qiǎo','líng qiào','lǐng qiǎo'],1,'“灵”读 líng，后鼻音；“巧”读 qiǎo，第三声。'],
['稍微','拼音辨析','“稍微”的正确拼音是？',['sāo wēi','shāo wèi','shāo wēi','shǎo wēi'],2,'“稍”读 shāo；“微”读 wēi。'],
['模仿','拼音辨析','“模仿”的正确拼音是？',['mú fǎng','mó fǎng','mó fáng','mǒ fǎng'],1,'“模仿”的“模”读 mó，“仿”读 fǎng。'],
['锻炼','拼音辨析','“锻炼”的正确拼音是？',['duàn liàn','duǎn liàn','duàn niàn','duān liàn'],0,'“锻”读 duàn，“炼”读 liàn。'],
['勤奋','拼音辨析','“勤奋”的正确拼音是？',['qíng fèn','qǐn fèn','qín fèn','qín fēn'],2,'“勤”是前鼻音 qín；“奋”读 fèn。'],
['退缩','词语理解','“面对困难，他没有退缩。”这里“退缩”的意思是？',['向后走几步','因为害怕或困难而不敢继续','暂时休息','改变走路方向'],1,'“退缩”在这里指遇到困难而畏惧、不敢继续。'],
['目不转睛','词语理解','“大家目不转睛地看着表演。”最准确的意思是？',['眼睛很疲劳','看得很快','注意力集中地盯着看','反复转动眼睛'],2,'强调视线集中、不移开，不只是“看得仔细”。'],
['耐心','词语理解','“老师耐心地解释。”这里“耐心”强调什么？',['不怕麻烦，愿意持续细致地说明','说话声音很大','解释速度很快','只解释一次'],0,'耐心指不急躁、不厌烦，能持续认真处理。'],
['贴心','词语应用','哪一句最能表现“贴心”？',['他认真抄写作业。','她发现奶奶怕冷，主动拿来外套。','他每天跑步锻炼。','大家准时到达学校。'],1,'贴心强调体察他人的需要并给予关怀。'],
['劝告','词语应用','下列哪一句使用“劝告”最恰当？',['我劝告了一本新书。','雨水劝告着窗户。','听了爸爸的劝告，他改掉了熬夜的习惯。','桌子接受了我的劝告。'],2,'“劝告”是劝人改正行为或采取适当做法。'],
['眉开眼笑','词语应用','哪一句使用“眉开眼笑”最恰当？',['得知自己获奖，小明顿时眉开眼笑。','他眉开眼笑地哭了整晚。','这座大楼眉开眼笑。','她眉开眼笑地感到绝望。'],0,'“眉开眼笑”形容非常高兴的神态。'],
['浮现','词语应用','听到熟悉的歌声，童年的回忆又在脑海中____。',['浮现','浮游','浮夸','浮动'],0,'“回忆浮现”指记忆重新出现在脑海中。'],
['坚持','词语应用','虽然练习很辛苦，他仍然____每天阅读。',['坚固','坚持','坚硬','坚定'],1,'“坚持”表示持续做某件事，不轻易放弃。'],
['改善','词语应用','学校增设遮雨棚，希望____学生雨天通行的情况。',['改写','改善','改造','改名'],1,'“改善情况”搭配自然，表示使情况变得更好。'],
['观察','词语理解','“请仔细观察植物的变化。”这里“观察”是指？',['随便看一眼','认真察看并留意变化','闭眼想象','立即下结论'],1,'观察需要有目的地细看并收集信息。'],
['鼓励','词语理解','“同学的鼓励让他重拾信心。”这里“鼓励”指？',['给予支持，使人更有信心','严厉责骂','替别人完成任务','要求别人沉默'],0,'鼓励是通过言语或行动给予支持。'],
['犹豫','词语理解','“面对两个选择，他犹豫了很久。”这里“犹豫”指？',['马上决定','难以决定，拿不定主意','非常高兴','完全忘记'],1,'犹豫指拿不定主意，迟迟不能决定。'],
['珍惜','词语应用','我们应该____与家人相处的时间。',['珍贵','珍惜','珍藏','珍重'],1,'“珍惜时间”表示重视并好好利用。'],
['详细','词语应用','老师把实验步骤说明得十分____，大家都听懂了。',['细心','仔细','详细','精心'],2,'“详细”强调内容具体、完整，适合修饰说明。']
].map((x,i)=>({id:i,word:x[0],type:x[1],q:x[2],options:x[3],correct:x[4],why:x[5]}));
let pool=[],pos=0,selected=null,submitted=false,answers=[];const $=id=>document.getElementById(id);const storageKey='zhixu_p6_wrong_v01';const getWrong=()=>{try{return JSON.parse(localStorage.getItem(storageKey)||'[]')}catch{return []}};function show(id){['home','quiz','results'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function home(){show('home');$('saved').textContent=`本浏览器上次记录：${getWrong().length} 道错题。`;}function start(custom){let mode=$('mode').value;pool=custom||questions.filter(x=>mode==='all'||(mode==='wrong'?getWrong().includes(x.id):x.type===mode));if(!pool.length){alert('当前没有错题可复习，请选择其他模式。');return}pos=0;answers=[];show('quiz');render()}function render(){selected=null;submitted=false;let x=pool[pos];$('progress').textContent=`第 ${pos+1} / ${pool.length} 题 · ${x.word}`;$('category').textContent=x.type;$('fill').style.width=(pos/pool.length*100)+'%';$('question').textContent=x.q;$('options').innerHTML='';x.options.forEach((opt,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+opt;b.onclick=()=>{if(submitted)return;selected=i;document.querySelectorAll('.option').forEach((el,j)=>el.classList.toggle('selected',j===i));$('check').disabled=false};$('options').appendChild(b)});$('feedback').classList.add('hidden');$('check').classList.remove('hidden');$('check').disabled=true;$('next').classList.add('hidden');$('next').textContent=pos===pool.length-1?'查看成绩 →':'下一题 →'}$('check').onclick=()=>{if(selected===null||submitted)return;submitted=true;let x=pool[pos],ok=selected===x.correct;answers.push({x,selected,ok});document.querySelectorAll('.option').forEach((el,i)=>{el.disabled=true;if(i===x.correct)el.classList.add('correct');else if(i===selected)el.classList.add('wrong')});$('feedback').textContent=(ok?'✓ 回答正确。':'✗ 回答错误。')+' 正确答案：'+x.options[x.correct]+'。'+x.why;$('feedback').classList.remove('hidden');$('check').classList.add('hidden');$('next').classList.remove('hidden')};$('next').onclick=()=>{if(++pos<pool.length)render();else finish()};function finish(){let wrong=answers.filter(a=>!a.ok),right=answers.length-wrong.length;$('fill').style.width='100%';$('score').textContent=`${right} / ${answers.length}`;$('summary').textContent=`正确率 ${Math.round(right/answers.length*100)}% · 错题 ${wrong.length} 道`;$('review').innerHTML='';if(wrong.length){let h=document.createElement('h3');h.textContent='本次错题';$('review').appendChild(h);wrong.forEach(a=>{let p=document.createElement('p');p.textContent=`${a.x.word}：${a.x.why}`;$('review').appendChild(p)})}else $('review').textContent='太棒了！本次全部答对。';localStorage.setItem(storageKey,JSON.stringify(wrong.map(a=>a.x.id)));$('retry').disabled=wrong.length===0;$('retry').onclick=()=>start(wrong.map(a=>a.x));show('results')}$('start').onclick=()=>start();$('again').onclick=home;home();
</script></body></html>
